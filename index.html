<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LAMBIDA</title>
  <style>
    :root{
      --bg: #fffae7;
      --brand-red: #cc624a; /* cor retirada da logo */
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: 'TheHandWideBlack', Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: var(--bg);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px;
    }

    @font-face {
      font-family: 'TheHandWideBlack';
      src: url('The Hand Wide Black.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

      @font-face {
      font-family: 'TheHandWideHeavy';
      src: url('The Hand Wide Heavy.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    svg{
      max-width:360px;
      width:100%;
      height:auto;
      display:block;
      margin-bottom:24px;
    }

    h1{
      font-size: clamp(30px, 7vw, 60px);
      color:var(--brand-red);
      font-family: 'TheHandWideHeavy', sans-serif;
      letter-spacing:1px;  
      line-height: 13vh;
    }

    h2{
      font-size: clamp(24px, 5vw, 40px);
      color:var(--brand-red);
      font-family: 'TheHandWideBlack', sans-serif;
      letter-spacing:1px;
      a{
      color:var(--brand-red);
      font-family: 'TheHandWideHeavy', sans-serif;
      }
    }

  </style>
</head>
